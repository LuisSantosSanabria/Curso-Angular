<h1>DragonBall Page</h1>
<hr />

<section class="row">

  <div class="col-6 col-sm-12">
    <h3>Agregar: {{ name() }}</h3>

    <input type="text"
    class="form-control"
    placeholder="Nombre"
    [value]="name()"
    (change)="name.set( txtName.value)"
    (input)="name.set(txtName.value)"
    #txtName
    />
   <!--llaves cuadradas cuando un atributo viene de una variable o signal-->
    <input type="number"
    class="form-control mt-2"
    placeholder="Poder"
    [value]="power()"
    (input)="power.set(txtPower.valueAsNumber)"

    (input)="power.set(+txtPower.value)"
    #txtPower
    />

    <button (click)="addCharacter()" class="mt-2 btn btn-primary">Agregar</button>
  </div>

  <div class="col-6 col-sm-12">
    <h3>Listado</h3>
    <ul>
      @for (character of characters(); track character.id; let idx = $index) {
      @if ( character.power > 500) {
      <li>
        <span>{{idx + 1}} - {{ character.name}}</span>
        <strong [class.text-danger]="character.power > 9000"
                [class.text-primary]="character.power < 9000">

          <!-- [ngClass]="powerClasses"-->
          ({{ character.power}})</strong>
      </li>
      }
      @else {
        <li><strong>Aqui no pasa nada</strong></li>
      }
    }
    </ul>
  </div>



</section>
